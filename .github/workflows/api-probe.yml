name: api-probe

# Prints public signatures of Minecraft classes (javap) as annotations, to check APIs while developing.
on:
  workflow_dispatch:
    inputs:
      classes:
        description: "Space-separated fully qualified class names"
        required: true
      grep:
        description: "Optional regex to filter member lines"
        required: false
        default: ""
      find:
        description: "Optional regex: list classes on the classpath whose path matches"
        required: false
        default: ""

jobs:
  split:
    runs-on: ubuntu-latest
    outputs:
      classes: ${{ steps.split.outputs.classes }}
    steps:
      - id: split
        env:
          CLASSES: ${{ github.event.inputs.classes }}
        run: echo "classes=$(python3 -c 'import json,os;print(json.dumps(os.environ["CLASSES"].split()))')" >> "$GITHUB_OUTPUT"
  probe:
    needs: split
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        class: ${{ fromJson(needs.split.outputs.classes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: javap
        env:
          CLASS: ${{ matrix.class }}
          FILTER: ${{ github.event.inputs.grep }}
        run: |
          cat >> build.gradle <<'G'

          tasks.register("printCompileClasspath") {
          	doLast {
          		println "CP=" + sourceSets.main.compileClasspath.asPath
          	}
          }
          G
          ./gradlew printCompileClasspath --no-configuration-cache --console=plain -q | grep '^CP=' | sed 's/^CP=//' > cp.txt
          echo "classpath entries: $(tr ":" "\n" < cp.txt | wc -l)"
          javap -cp "$(cat cp.txt)" -protected "$CLASS" > probe.txt 2>&1 || true
          if [ -n "$FILTER" ]; then grep -E "class |interface |enum |record |$FILTER" probe.txt > f.txt || true; mv f.txt probe.txt; fi
          cat probe.txt
          python3 .github/scripts/annotate.py probe.txt "$CLASS" warning 40 10
          tail -n +401 probe.txt > rest.txt; python3 .github/scripts/annotate.py rest.txt "$CLASS" notice 40 10
      - name: find
        if: ${{ github.event.inputs.find != '' && strategy.job-index == 0 }}
        env:
          FIND: ${{ github.event.inputs.find }}
        run: |
          for jar in $(tr ":" " " < cp.txt); do
            case "$jar" in *.jar) unzip -Z1 "$jar" 2>/dev/null | grep '\.class$' | grep -v '\$' | grep -E "$FIND" || true;; esac
          done | sed 's/\.class$//;s#/#.#g' | sort -u > found.txt
          wc -l found.txt
          python3 .github/scripts/annotate.py found.txt "find" warning 40 10
