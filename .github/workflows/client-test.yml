name: client-test

# Starts a real client (virtual display, software rendering), walks through the mod's screens and pushes
# the screenshots to the ci-screenshots branch.
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and software rendering
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 > /dev/null
      - run: chmod +x ./gradlew
      - name: Run client game test
        id: run
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --console=plain > client.log 2>&1
      - name: Report
        if: always()
        run: |
          tail -n 60 client.log > tail.txt
          python3 .github/scripts/annotate.py tail.txt "client-log-tail" warning 30 2
          grep -n -E "ERROR|Exception|Caused by|\[client-test\]|FAILED|at com\.contagion" client.log | head -150 > errors.txt || true
          python3 .github/scripts/annotate.py errors.txt "client-errors" warning 30 5
          find . -path ./node_modules -prune -o -name "*.png" -path "*screenshots*" -print > shots.txt || true
          python3 .github/scripts/annotate.py shots.txt "screenshots" notice 40 1
      - name: Push screenshots
        if: always()
        run: |
          mkdir -p /tmp/shots
          while read -r f; do cp "$f" /tmp/shots/; done < shots.txt
          cp client.log /tmp/shots/client.log
          cd /tmp/shots
          git init -q
          git checkout -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
